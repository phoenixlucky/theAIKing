<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The AI King — AI Agent Skill / 插件 / LSP 索引</title>
  <link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>
  <header class="header">
    <div class="container">
      <button id="langToggle" class="lang-toggle" type="button" aria-label="Switch language">EN</button>
      <h1>👑 The AI King</h1>
      <p class="subtitle" id="subtitle">收集热门且好用的 AI Agent Skill、插件与 LSP，指导各种 AI Agent 快速一键安装配置</p>
      <p class="meta" id="metaLine"></p>
    </div>
  </header>

  <main class="container">
    <!-- Controls: Filter + Search -->
    <section class="controls">
      <div class="filter-panel">
        <div class="filter-panel-head">
          <div class="filter-title">
            <span class="filter-kicker" id="filterKicker">分类筛选</span>
            <span class="filter-sub" id="filterSummary"></span>
          </div>
          <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索技能名称或描述…" autocomplete="off">
          </div>
        </div>
        <div class="filter-bar" id="filterBar" role="group" aria-label="技能分类筛选"></div>
      </div>
    </section>

    <!-- Stats bar -->
    <section class="stats-bar">
      <span><span id="selectedLabel">已选</span> <strong id="selectedCount">0</strong> <span id="itemUnit">项</span></span>
      <button class="btn btn-secondary" id="selectAllBtn">✅ 全选</button>
      <button class="btn btn-primary" id="generateBtn">📋 生成安装指令</button>
      <button class="btn btn-secondary" id="clearBtn">清除选择</button>
    </section>

    <!-- Install instructions output -->
    <section class="output-section" id="outputSection" style="display:none;">
      <h2 id="outputTitle">📋 安装指令</h2>
      <p class="output-hint" id="outputHint">将下方内容直接提供给 AI Agent：</p>
      <textarea id="outputText" readonly rows="12"></textarea>
      <button class="btn btn-primary" id="copyBtn">📄 复制到剪贴板</button>
    </section>

    <!-- Skill cards grid -->
    <section class="skills-grid" id="skillsGrid">
      <!-- Rendered by JS -->
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p id="footerText">由 <a href="https://github.com/phoenixlucky/theAIKing" target="_blank">theAIKing</a> 项目维护 · 欢迎提交 Issue 和 PR</p>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="js/script.js?v=e34705e4"></script>
</body>
</html>
